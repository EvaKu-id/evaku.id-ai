name: evaku-ai

services:
  api:
    build:
      context: .
      target: api
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      MODEL_API_KEY: ${MODEL_API_KEY:?set MODEL_API_KEY in .env}
      DATA_VERSION: ${DATA_VERSION:-dev}
      MODEL_VERSION: ${MODEL_VERSION:-dev}
    ports:
      - "8000:8080"
    volumes:
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  pipeline:
    profiles: ["pipeline"]
    build:
      context: .
      target: pipeline
    env_file: .env
    environment:
      SUPABASE_DB_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
    command: ["run", "--mode", "replay"]
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      db:
        condition: service_healthy

  db:
    profiles: ["db", "pipeline"]
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
