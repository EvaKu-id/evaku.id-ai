[project]
name = "evaku-ai"
version = "0.1.0"
description = "Evaku AI/ML service: access engine, model API, and data pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
storage = [
    "boto3>=1.35",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "evaku-ai[storage]",
]
geo = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.9",
    "rasterio>=1.4",
    "pyarrow>=17.0",
    "zstandard>=0.23",
]
pipeline = [
    "evaku-ai[geo]",
    "earthengine-api>=1.0",
    "onnxruntime>=1.19",
    "lightgbm>=4.5",
    "psycopg[binary]>=3.2",
    "evaku-ai[storage]",
    "osmnx>=1.9",
    "scikit-image>=0.24",
    "typer>=0.12",
]

[project.scripts]
evaku-pipeline = "evaku_ai.pipeline.cli:app"
evaku-static = "evaku_ai.static_data.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.1",
    "pip-audit>=2.7",
    "pre-commit>=3.8",
    "pandas-stubs>=3.0.5.260914",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaku_ai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S", "FIX", "ERA"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["evaku_ai", "tests"]

[tool.ruff.lint.flake8-bugbear]
# Frozen dataclasses with defaults are safe as argument defaults.
extend-immutable-calls = [
    "evaku_ai.domain.rules.EvacuationRules",
    "evaku_ai.domain.rules.FacilityRules",
    "evaku_ai.domain.rules.HandRules",
    "evaku_ai.domain.rules.IsolationRules",
    "evaku_ai.domain.rules.PassabilityThresholds",
    "evaku_ai.domain.rules.RoadNetworkRules",
    "evaku_ai.domain.rules.RouteRules",
    "evaku_ai.domain.rules.ScoreWeights",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs local services (`docker compose --profile db up -d`) or downloaded tools",
]
addopts = "-m 'not integration'"

[tool.coverage.run]
branch = true
# Coverage gate applies to the pure and contract layers; I/O layers get integration tests.
include = [
    "src/evaku_ai/domain/*",
    "src/evaku_ai/engine/*",
    "src/evaku_ai/geo/*",
    "src/evaku_ai/api/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["raise NotImplementedError"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
disallow_any_explicit = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "geopandas.*",
    "shapely.*",
    "rasterio.*",
    "pyogrio.*",
    "osmnx.*",
    "whitebox.*",
    "onnxruntime.*",
    "lightgbm.*",
    "ee.*",
    "boto3.*",
    "botocore.*",
    "psycopg.*",
    "typer.*",
    "pyarrow.*",
]
ignore_missing_imports = true

[tool.importlinter]
root_package = "evaku_ai"

[[tool.importlinter.contracts]]
name = "Pure layers do not depend on I/O or entrypoints"
type = "forbidden"
source_modules = ["evaku_ai.domain", "evaku_ai.engine", "evaku_ai.geo"]
forbidden_modules = [
    "evaku_ai.adapters",
    "evaku_ai.api",
    "evaku_ai.pipeline",
    "evaku_ai.static_data",
    "evaku_ai.inference",
]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "evaku_ai.api | evaku_ai.pipeline | evaku_ai.static_data",
    "evaku_ai.adapters | evaku_ai.inference",
    "evaku_ai.engine | evaku_ai.geo",
    "evaku_ai.domain",
    "evaku_ai.core",
]
